[project]
name = "central-saude-upe-backend"
version = "0.1.0"
description = "API e Worker da Central Inteligente de Teleagendamento (CH/UPE)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.143.0",
    "uvicorn[standard]~=0.54.0",
    "sqlalchemy~=2.1.4",
    "psycopg[binary]~=3.3.6",
    "alembic~=1.20.0",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.15.0",
    "pyjwt~=2.15.1",
    "argon2-cffi~=25.1.0",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "httpx~=0.28.1",
    "ruff~=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integracao: usa o PostgreSQL real definido por DATABASE_URL",
    "lento: carga do histórico do seed (minutos); `scripts/testar.sh --rapido` pula",
    "ultimo: roda depois de todos os outros (confere o que a suíte inteira provocou)",
]
