# Central Inteligente de Teleagendamento — CH/UPE
#
# Uso:
#   docker compose up -d                     # postgres + migrate + api + worker
#   docker compose --profile dev up -d       # + mailpit (caixa de e-mail falsa em http://localhost:8025)
#   docker compose --profile proxy up -d     # + nginx (exige o build do frontend e o certificado: docs/operations/deployment.md)
#   docker compose --profile build run --rm web-build     # gera apps/web/dist (npm ci + build, sem Node no host)
#   docker compose --profile certbot up -d   # renovação automática do certificado (produção)
#
# API e Worker usam a MESMA imagem (apps/backend) com comandos diferentes (ADR-005).
# O serviço "migrate" aplica as migrações uma vez antes de API e Worker subirem.

name: central-saude-upe

x-backend: &backend
  build:
    context: ./apps/backend
    args:
      # false em produção: a imagem não leva pytest nem ruff.
      INSTALL_DEV: ${INSTALL_DEV:-true}
  image: central-saude-upe/backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  networks: [interna]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só na máquina local (127.0.0.1), para DBeaver/psql. Nunca exposto para fora da VM.
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.10"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Só na máquina local; em produção o acesso externo é pelo nginx.
    ports:
      - "127.0.0.1:${API_PORT_HOST:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [interna, borda]

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"   # interface web para ver os e-mails enviados
    networks: [interna]
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    profiles: [proxy]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    # Recarrega a cada 6 h para pegar o certificado renovado pelo serviço certbot.
    command: ["/bin/sh", "-c", "(while :; do sleep 21600; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      borda:
        # IP fixo: é o único em quem a API confia para o X-Forwarded-For (--forwarded-allow-ips).
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  # Renova o certificado (Let's Encrypt, desafio HTTP-01 pelo webroot do nginx).
  certbot:
    image: certbot/certbot
    profiles: [certbot]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done"]
    volumes:
      - ./infra/nginx/certs:/etc/letsencrypt
      - ./infra/certbot:/infra:ro
      - certbot-www:/var/www/certbot
    networks: [interna]
    restart: unless-stopped

  # Build do frontend: escreve em ./apps/web/dist, de onde o nginx serve.
  web-build:
    build:
      context: ./apps/web
    image: central-saude-upe/web-build:local
    profiles: [build]
    command: ["npm", "run", "build"]
    volumes:
      - ./apps/web/dist:/app/dist
    restart: "no"

volumes:
  pgdata:
  certbot-www:

networks:
  # borda: nginx ↔ api. interna: api, worker, migrate, postgres, mailpit.
  # O postgres não está na rede borda e não publica porta para fora de 127.0.0.1.
  borda:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  interna: