# Nginx de produção da Central de Teleagendamento (compose, perfil `proxy`).
# O domínio não aparece aqui: o certificado fica sempre em live/central (ver scripts/certificado.sh).
# Os snippets (cabeçalhos de segurança e proxy da API) vêm de /etc/nginx/snippets.
# Cada location que usa add_header inclui seguranca.conf: add_header num location descarta os de cima.

server_tokens off;

# Limites por IP (RF/AM-004, AM-025). Pensados para uma sala atrás do mesmo NAT.
limit_req_zone $binary_remote_addr zone=geral:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=indicadores:10m rate=1r/s;
limit_req_status 429;

# Docker DNS: o nginx reresolve `api` quando o contêiner é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Desafio HTTP-01 do Let's Encrypt (webroot compartilhado com o serviço certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/live/central/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/central/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # A API só recebe JSON pequeno.
    client_max_body_size 1m;

    # Só nos estáticos; a API não é comprimida (BREACH).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Erros do próprio nginx falam Problem Details (RFC 9457), como a API.
    error_page 413 = @problema_413;
    error_page 429 = @problema_429;
    error_page 502 504 = @problema_indisponivel;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguranca.conf;
    }

    # O Vite põe hash no nome dos arquivos de /assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/seguranca.conf;
    }

    # O nginx escolhe o prefixo mais longo; cada location repete o proxy e soma os limites.
    location /api/v1/auth/ {
        limit_req zone=geral burst=150 nodelay;
        limit_req zone=auth burst=40 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Sem nodelay: atrasa em vez de recusar, até estourar o burst.
    location = /api/v1/equipe/indicadores {
        limit_req zone=geral burst=150 nodelay;
        limit_req zone=indicadores burst=5;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/ {
        limit_req zone=geral burst=150 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location @problema_413 {
        internal;
        default_type application/problem+json;
        charset utf-8;
        charset_types application/problem+json;
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"Requisição grande demais."}';
    }

    location @problema_429 {
        internal;
        default_type application/problem+json;
        charset utf-8;
        charset_types application/problem+json;
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        # Mesmo "type" e mesmo texto do 429 da API (mensagensPorTipo no frontend).
        return 429 '{"type":"/problemas/muitas-tentativas","title":"Too Many Requests","status":429,"detail":"Muitas tentativas. Aguarde alguns minutos e tente de novo."}';
    }

    location @problema_indisponivel {
        internal;
        default_type application/problem+json;
        charset utf-8;
        charset_types application/problem+json;
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Serviço indisponível no momento. Tente de novo em instantes."}';
    }
}
