# Proxy para a API. Variável + resolver: reresolve `api` após recriar o contêiner,
# e o caminho original segue sem alteração.
set $api_upstream http://api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# SUBSTITUI o valor enviado pelo cliente (a API só confia neste nginx, 172.30.0.10).
# Nunca acrescente ao valor do cliente: permitiria forjar o IP e fugir do limite de login.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
gzip off;
include /etc/nginx/snippets/seguranca.conf;
